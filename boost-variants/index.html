<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOOST — 30 визуальных концепций</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Onest:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;
  --surface:#12121a;
  --border:#1e1e2a;
  --text:#e8e6e3;
  --text-dim:#7a7a8a;
  --accent:#c8ff00;
  --accent2:#ff3366;
  --accent3:#00d4ff;
}
html{scroll-behavior:smooth}
body{
  font-family:'Onest',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}
.noise{
  position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:9999;opacity:.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
.hero{
  padding:80px 40px 40px;
  max-width:1400px;margin:0 auto;
  position:relative;
}
.hero::before{
  content:'';position:absolute;top:0;right:0;
  width:600px;height:600px;
  background:radial-gradient(circle,rgba(200,255,0,.06) 0%,transparent 70%);
  pointer-events:none;
}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 16px;
  border:1px solid var(--border);
  border-radius:100px;
  font-size:12px;letter-spacing:.05em;
  color:var(--text-dim);
  text-transform:uppercase;
  margin-bottom:24px;
}
.badge span{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
h1{
  font-family:'Unbounded',sans-serif;
  font-size:clamp(36px,6vw,72px);
  font-weight:900;
  line-height:1.05;
  letter-spacing:-.02em;
  margin-bottom:20px;
}
h1 .highlight{
  background:linear-gradient(135deg,var(--accent),var(--accent3));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.subtitle{
  font-size:clamp(16px,2vw,22px);
  color:var(--text-dim);
  max-width:600px;
  line-height:1.5;
  margin-bottom:40px;
}
.stats{
  display:flex;gap:40px;
  padding:24px 0;
  border-top:1px solid var(--border);
  margin-bottom:60px;
}
.stat{display:flex;flex-direction:column;gap:4px}
.stat-num{font-family:'Unbounded',sans-serif;font-size:28px;font-weight:700;color:var(--accent)}
.stat-label{font-size:13px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em}

.filters{
  display:flex;flex-wrap:wrap;gap:8px;
  margin-bottom:40px;
  position:sticky;top:0;z-index:100;
  background:rgba(10,10,15,.9);
  backdrop-filter:blur(20px);
  padding:16px 0;
  border-bottom:1px solid var(--border);
}
.filter-btn{
  padding:8px 18px;
  border:1px solid var(--border);
  border-radius:100px;
  background:transparent;
  color:var(--text-dim);
  font-family:'Onest',sans-serif;
  font-size:13px;
  cursor:pointer;
  transition:all .25s ease;
}
.filter-btn:hover,.filter-btn.active{
  border-color:var(--accent);
  color:var(--accent);
  background:rgba(200,255,0,.05);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:20px;
  max-width:1400px;
  margin:0 auto;
  padding:0 40px 120px;
}
.card{
  position:relative;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  text-decoration:none;
  color:var(--text);
  transition:all .35s cubic-bezier(.4,0,.2,1);
  opacity:0;
  transform:translateY(20px);
  animation:fadeIn .5s forwards;
}
.card:nth-child(1){animation-delay:.05s}
.card:nth-child(2){animation-delay:.1s}
.card:nth-child(3){animation-delay:.15s}
.card:nth-child(4){animation-delay:.2s}
.card:nth-child(5){animation-delay:.25s}
.card:nth-child(6){animation-delay:.3s}
.card:nth-child(7){animation-delay:.35s}
.card:nth-child(8){animation-delay:.4s}
.card:nth-child(9){animation-delay:.45s}
.card:nth-child(10){animation-delay:.5s}
.card:nth-child(n+11){animation-delay:.55s}
@keyframes fadeIn{to{opacity:1;transform:translateY(0)}}
.card:hover{
  transform:translateY(-4px);
  border-color:var(--accent);
  box-shadow:0 20px 60px rgba(200,255,0,.06);
}
.card-accent{
  height:4px;
  width:100%;
}
.card-body{padding:24px}
.card-number{
  font-family:'Unbounded',sans-serif;
  font-size:11px;
  font-weight:700;
  color:var(--text-dim);
  letter-spacing:.1em;
  margin-bottom:12px;
}
.card-title{
  font-family:'Unbounded',sans-serif;
  font-size:18px;
  font-weight:700;
  margin-bottom:8px;
  line-height:1.3;
}
.card-desc{
  font-size:14px;
  color:var(--text-dim);
  line-height:1.6;
  margin-bottom:16px;
}
.card-tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{
  padding:4px 10px;
  border-radius:100px;
  font-size:11px;
  background:rgba(255,255,255,.05);
  color:var(--text-dim);
  border:1px solid rgba(255,255,255,.06);
}
.card-arrow{
  position:absolute;bottom:20px;right:20px;
  width:32px;height:32px;
  border-radius:50%;
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;
  transition:all .3s ease;
}
.card:hover .card-arrow{
  border-color:var(--accent);
  color:var(--accent);
  transform:translate(2px,-2px);
}

.footer{
  text-align:center;
  padding:40px;
  border-top:1px solid var(--border);
  color:var(--text-dim);
  font-size:13px;
}
.footer a{color:var(--accent);text-decoration:none}

@media(max-width:768px){
  .hero{padding:60px 20px 30px}
  .grid{grid-template-columns:1fr;padding:0 20px 80px}
  .stats{flex-wrap:wrap;gap:24px}
  .filters{padding:12px 20px}
}
</style>
</head>
<body>
<div class="noise"></div>

<section class="hero">
  <div class="badge"><span></span>COLLECTION · 30 VARIANTS</div>
  <h1>BOOST <span class="highlight">30</span><br>визуальных концепций</h1>
  <p class="subtitle">Каждый лендинг — уникальная визуальная интерпретация интенсива по вайбкодингу Вани Замесина. От брутализма до космоса.</p>
  <div class="stats">
    <div class="stat"><span class="stat-num">30</span><span class="stat-label">Концепций</span></div>
    <div class="stat"><span class="stat-num">30</span><span class="stat-label">Уникальных стилей</span></div>
    <div class="stat"><span class="stat-num">10</span><span class="stat-label">Визуальных категорий</span></div>
  </div>
</section>

<div class="filters">
  <button class="filter-btn active" data-filter="all">Все</button>
  <button class="filter-btn" data-filter="minimal">Минимализм</button>
  <button class="filter-btn" data-filter="retro">Ретро</button>
  <button class="filter-btn" data-filter="organic">Органика</button>
  <button class="filter-btn" data-filter="futuristic">Футуризм</button>
  <button class="filter-btn" data-filter="luxury">Люкс</button>
  <button class="filter-btn" data-filter="brand">Бренды</button>
  <button class="filter-btn" data-filter="playful">Playful</button>
  <button class="filter-btn" data-filter="data">Данные</button>
  <button class="filter-btn" data-filter="concept">Концепт</button>
</div>

<div class="grid" id="grid"></div>

<footer class="footer">
  BOOST · 30 визуальных концепций · <a href="https://boost-intensive.ru" target="_blank">boost-intensive.ru</a>
</footer>

<script>
const variants = [
  {id:"01",dir:"01-brutalist",name:"Brutalist",desc:"Брутализм — крупная типографика, жёсткая сетка, чёрно-белая палитра. Никакого декора — только структура.",style:"minimal",tags:["монохром","типографика","сетка"],accent:"#ffffff"},
  {id:"02",dir:"02-terminal",name:"Terminal",desc:"Терминальный интерфейс — чёрный фон, зелёный моноспейс, анимация набора текста. Хакерская эстетика.",style:"futuristic",tags:["моноспейс","анимация","терминал"],accent:"#00ff41"},
  {id:"03",dir:"03-swiss-grid",name:"Swiss Grid",desc:"Швейцарский международный стиль — строгая сетка, Helvetica, минимум элементов, красный акцент.",style:"minimal",tags:["сетка","Helvetica","минимализм"],accent:"#ff0000"},
  {id:"04",dir:"04-90s-web",name:"90s Web",desc:"Ретро-веб 90-х — таблицы, marquee, яркие цвета, пиксельные иконки, гостиевая книга.",style:"retro",tags:["90-е","таблицы","marquee"],accent:"#ff00ff"},
  {id:"05",dir:"05-soviet-constructivism",name:"Soviet Constructivism",desc:"Советский конструктивизм — красный/чёрный, геометрия, диагональные композиции, пропагандистский стиль.",style:"retro",tags:["конструктивизм","геометрия","пропаганда"],accent:"#ff0000"},
  {id:"06",dir:"06-retro-computing",name:"Retro Computing",desc:"8-бит ретро — пиксельные шрифты, CRT-эффект, палитра EGA, анимация мерцания.",style:"retro",tags:["8-bit","CRT","пиксели"],accent:"#00ffff"},
  {id:"07",dir:"07-paper-craft",name:"Paper & Craft",desc:"Бумага и хендмейд — текстура крафта, скотч, рукописный шрифт, вырезанные элементы.",style:"organic",tags:["бумага","хендмейд","текстура"],accent:"#c4956a"},
  {id:"08",dir:"08-ocean-fluid",name:"Ocean Fluid",desc:"Океан и жидкость — синие градиенты, анимация волн на canvas, плавные переходы.",style:"organic",tags:["canvas","волны","градиент"],accent:"#0066ff"},
  {id:"09",dir:"09-biophilic",name:"Biophilic",desc:"Биофильный дизайн — зелёные тона, органические формы, листовые паттерны, жизнь.",style:"organic",tags:["зелёный","органика","природа"],accent:"#22c55e"},
  {id:"10",dir:"10-cyberpunk",name:"Cyberpunk",desc:"Киберпанк — тёмный фон, неоновые градиенты, глитч-эффекты, distopia future.",style:"futuristic",tags:["неон","глитч","тёмная тема"],accent:"#ff00ff"},
  {id:"11",dir:"11-holographic",name:"Holographic",desc:"Голограмма — иризесцентные цвета, glassmorphism, преломление света, переливы.",style:"futuristic",tags:["glassmorphism","иридесценция","свет"],accent:"#a855f7"},
  {id:"12",dir:"12-space-orbital",name:"Space Orbital",desc:"Космос и орбиты — глубокий синий, звёзды, орбитальные анимации, параллакс.",style:"futuristic",tags:["космос","звёзды","параллакс"],accent:"#3b82f6"},
  {id:"13",dir:"13-luxury-editorial",name:"Luxury Editorial",desc:"Люкс и журнал — serif-шрифты, золотые акценты, просторные поля, элегантность.",style:"luxury",tags:["serif","золото","журнал"],accent:"#d4a574"},
  {id:"14",dir:"14-wabi-sabi",name:"Wabi-Sabi",desc:"Японский минимализм — несовершенные формы, земляные тона, асимметрия, покой.",style:"luxury",tags:["Япония","земляные тона","асимметрия"],accent:"#a0845c"},
  {id:"15",dir:"15-monochrome-noir",name:"Monochrome Noir",desc:"Нуар — полностью чёрно-белый, драматическое освещение, тени, контраст.",style:"luxury",tags:["чёрно-белый","драма","тени"],accent:"#ffffff"},
  {id:"16",dir:"16-hekslet",name:"Хекслет",desc:"Manrope, тёмный hero, синий #1444E6, бейджи, benefits-полоса, чистый IT-стиль.",style:"brand",tags:["Manrope","синий","IT-образование"],accent:"#1444E6"},
  {id:"17",dir:"17-skillbox",name:"Skillbox",desc:"Inter, фиолетовый #3d3dff, мягкие тени, зелёные бейджи, карточки с hover-эффектами.",style:"brand",tags:["Inter","фиолетовый","современный"],accent:"#3d3dff"},
  {id:"18",dir:"18-coursera",name:"Coursera",desc:"Source Sans, синий #0056d2, gradient фиолетовый, inset-тени на кнопках, академичная чистота.",style:"brand",tags:["Source Sans","синий","академия"],accent:"#0056d2"},
  {id:"19",dir:"19-simulative",name:"Симулейтив",desc:"Onest, оранжевые неоновые тени 4px, жирные границы, дерзкий контрастный стиль.",style:"brand",tags:["Onest","оранжевый","неон-тени"],accent:"#ff9600"},
  {id:"20",dir:"20-stepik",name:"Stepik",desc:"Roboto, фиолетовый #6c7bdf, карточки с тенями, XP-прогресс, геймификация, скелетоны.",style:"brand",tags:["Roboto","фиолетовый","геймификация"],accent:"#6c7bdf"},
  {id:"21",dir:"21-matryoshka",name:"Matryoshka",desc:"Русский folk — матрёшка, народные мотивы, яркие цвета, орнаменты.",style:"playful",tags:["фолк","народный","орнамент"],accent:"#e63946"},
  {id:"22",dir:"22-comic-pop-art",name:"Comic Pop Art",desc:"Комикс и поп-арт — halftone, speech bubbles, жирные контуры, Лихтенштейн.",style:"playful",tags:["комикс","поп-арт","halftone"],accent:"#ffdd00"},
  {id:"23",dir:"23-rpg-game-ui",name:"RPG Game UI",desc:"RPG-интерфейс — характеристики, прогресс-бар, значки достижений, левелап.",style:"playful",tags:["RPG","игра","достижения"],accent:"#f59e0b"},
  {id:"24",dir:"24-dashboard",name:"Dashboard",desc:"Аналитическая панель — графики, метрики, dark mode, data-driven дизайн.",style:"data",tags:["аналитика","графики","dark mode"],accent:"#06b6d4"},
  {id:"25",dir:"25-timeline-journey",name:"Timeline Journey",desc:"Хронология — горизонтальная прокрутка, вехи, визуализация пути.",style:"data",tags:["таймлайн","прокрутка","вехи"],accent:"#8b5cf6"},
  {id:"26",dir:"26-mind-map",name:"Mind Map",desc:"Карта знаний — ветвящиеся пути, связанные узлы, граф знаний.",style:"data",tags:["граф","узлы","ветвление"],accent:"#10b981"},
  {id:"27",dir:"27-blueprint",name:"Blueprint",desc:"Технический чертёж — синий фон, белые штрихи, аннотации, измерения.",style:"concept",tags:["чертёж","техника"," аннотации"],accent:"#4a90d9"},
  {id:"28",dir:"28-film-noir",name:"Film Noir",desc:"Кино и постер — киноплёнка, grain, драматический свет, кинематографичность.",style:"concept",tags:["кино"," grain","драма"],accent:"#c0c0c0"},
  {id:"29",dir:"29-waveform-audio",name:"Waveform Audio",desc:"Звук и музыка — волны, эквалайзер, винил, аудио-визуализация на canvas.",style:"concept",tags:["звук","волны","canvas"],accent:"#f97316"},
  {id:"30",dir:"30-chaos-maximalism",name:"Chaos Maximalism",desc:"Хаос и максимализм — всё сразу: наложение, анимации, текстуры, эффекты.",style:"concept",tags:["хаос","максимализм","всё"],accent:"#ec4899"}
];

const grid=document.getElementById('grid');

function renderCards(filter='all'){
  grid.innerHTML='';
  const filtered=filter==='all'?variants:variants.filter(v=>v.style===filter);
  filtered.forEach((v,i)=>{
    const card=document.createElement('a');
    card.className='card';
    card.href=v.dir+'/index.html';
    card.style.animationDelay=`${i*.05}s`;
    card.innerHTML=`
      <div class="card-accent" style="background:${v.accent}"></div>
      <div class="card-body">
        <div class="card-number">#${v.id}</div>
        <div class="card-title">${v.name}</div>
        <div class="card-desc">${v.desc}</div>
        <div class="card-tags">${v.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      </div>
      <div class="card-arrow">↗</div>
    `;
    grid.appendChild(card);
  });
}

document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderCards(btn.dataset.filter);
  });
});

renderCards();
</script>
</body>
</html>
