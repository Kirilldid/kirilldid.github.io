<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Тест</title>
  <link rel="stylesheet" href="../shared/style.css">
</head>
<body>
  <div id="app"></div>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="../shared/app.js"></script>
  <script src="../shared/components.js"></script>
  <script>
    const QUESTIONS = {
      1: [
        { q: "Как будет «Спасибо» по-английски?", options: ["Please", "Thank you", "Sorry", "Hello"], answer: 1 },
        { q: "Переведите: «До свидания»", options: ["Hello", "Good morning", "Goodbye", "See you later"], answer: 2 },
        { q: "Что значит «How are you?»", options: ["Кто ты?", "Как дела?", "Где ты?", "Что делаешь?"], answer: 1 },
        { q: "«Пожалуйста» — это:", options: ["Thank you", "Sorry", "Please", "Hello"], answer: 2 },
        { q: "Выберите правильный перевод «Доброе утро»", options: ["Good evening", "Good night", "Good morning", "Goodbye"], answer: 2 },
      ],
      2: [
        { q: "«Мама» по-английски:", options: ["Father", "Mother", "Sister", "Brother"], answer: 1 },
        { q: "Переведите: «Семья»", options: ["Friend", "Family", "Father", "Mother"], answer: 1 },
        { q: "Что значит «brother»?", options: ["Сестра", "Брат", "Друг", "Папа"], answer: 1 },
        { q: "«Друг» — это:", options: ["Family", "Friend", "Brother", "Sister"], answer: 1 },
        { q: "Выберите «сестра»:", options: ["Mother", "Brother", "Sister", "Friend"], answer: 2 },
      ],
      3: [
        { q: "«Вода» по-английски:", options: ["Milk", "Tea", "Water", "Coffee"], answer: 2 },
        { q: "Переведите: «Хлеб»", options: ["Bread", "Rice", "Apple", "Chicken"], answer: 0 },
        { q: "Что значит «hungry»?", options: ["Жаждущий", "Голодный", "Усталый", "Весёлый"], answer: 1 },
        { q: "«Яблоко» — это:", options: ["Bread", "Apple", "Water", "Tea"], answer: 1 },
        { q: "Выберите «Кофе»:", options: ["Tea", "Milk", "Water", "Coffee"], answer: 3 },
      ],
    };

    const app = document.getElementById("app");
    const ctx = TelegramApp.init();
    const params = TelegramApp.getParams();
    const lessonId = params.lesson || 1;
    const questions = QUESTIONS[lessonId] || QUESTIONS[1];

    let current = 0;
    let score = 0;
    let wrongIds = [];
    let answered = false;

    function render() {
      if (current >= questions.length) {
        showResult();
        return;
      }

      const q = questions[current];
      UI.setProgress(current, questions.length);

      app.innerHTML = UI.renderShell(
        `Тест: Урок ${lessonId}`,
        `Вопрос ${current + 1} из ${questions.length}`,
        `
          <div class="card fade-in">
            <div style="font-size:1.125rem;font-weight:600;margin-bottom:16px">${q.q}</div>
            <div id="options">
              ${q.options.map((opt, i) => `
                <button class="quiz-option" onclick="select(${i})" id="opt-${i}">${opt}</button>
              `).join("")}
            </div>
          </div>
        `
      );
    }

    window.select = function (idx) {
      if (answered) return;
      answered = true;

      const q = questions[current];
      const correct = idx === q.answer;

      if (correct) {
        score++;
        document.getElementById(`opt-${idx}`).classList.add("correct");
      } else {
        wrongIds.push(`q${current}`);
        document.getElementById(`opt-${idx}`).classList.add("wrong");
        document.getElementById(`opt-${q.answer}`).classList.add("correct");
      }

      document.querySelectorAll(".quiz-option").forEach((btn) => (btn.disabled = true));

      setTimeout(() => {
        current++;
        answered = false;
        render();
      }, 800);
    };

    function showResult() {
      const payload = UI.generateResultPayload(params, score, questions.length, wrongIds);
      UI.saveLocalResult(payload);

      app.innerHTML = UI.renderShell(
        `Тест: Урок ${lessonId}`,
        "Результат",
        UI.renderResult(score, questions.length, [])
      );

      document.getElementById("actions").innerHTML = `
        <button class="btn btn-primary" onclick="TelegramApp.close()">Готово</button>
      `;
    }

    render();
  </script>
</body>
</html>
