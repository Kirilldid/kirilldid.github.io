<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Вставь слово</title>
  <link rel="stylesheet" href="../shared/style.css">
</head>
<body>
  <div id="app"></div>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="../shared/app.js"></script>
  <script src="../shared/components.js"></script>
  <script>
    const DATA = {
      1: [
        { sentence: "_____, how are you?", answer: "Hello", options: ["Hello", "Goodbye", "No", "Thanks"] },
        { sentence: "Thank _______,", answer: "you", options: ["you", "me", "it", "we"] },
        { sentence: "Good _______, everyone!", answer: "morning", options: ["morning", "night", "day", "time"] },
        { sentence: "Nice to _______, you!", answer: "meet", options: ["meet", "see", "look", "go"] },
        { sentence: " _______, sit down.", answer: "Please", options: ["Please", "Thank", "Yes", "No"] },
        { sentence: "Good _______, sir.", answer: "evening", options: ["evening", "morning", "night", "day"] },
        { sentence: " _______, I agree.", answer: "Yes", options: ["Yes", "No", "Please", "Thanks"] },
        { sentence: " _______, thank you.", answer: "No", options: ["No", "Yes", "Hello", "Please"] },
      ],
      2: [
        { sentence: "My _______ is a teacher.", answer: "mother", options: ["mother", "father", "friend", "brother"] },
        { sentence: "I have one _______.", answer: "sister", options: ["sister", "mother", "family", "friend"] },
        { sentence: "My _______ is older than me.", answer: "brother", options: ["brother", "sister", "father", "mother"] },
        { sentence: "I love my _______.", answer: "family", options: ["family", "friend", "sister", "brother"] },
        { sentence: "She is my best _______.", answer: "friend", options: ["friend", "family", "mother", "brother"] },
        { sentence: "He is very _______.", answer: "tall", options: ["tall", "short", "kind", "young"] },
        { sentence: "She has _______ hair.", answer: "short", options: ["short", "tall", "long", "young"] },
        { sentence: "He is a _______ person.", answer: "kind", options: ["kind", "tall", "short", "young"] },
      ],
      3: [
        { sentence: "Can I have some _______?", answer: "water", options: ["water", "bread", "coffee", "apple"] },
        { sentence: "I eat _______ for breakfast.", answer: "bread", options: ["bread", "water", "tea", "rice"] },
        { sentence: "I drink _______ every morning.", answer: "coffee", options: ["coffee", "tea", "milk", "water"] },
        { sentence: "Would you like some _______?", answer: "tea", options: ["tea", "coffee", "bread", "water"] },
        { sentence: "An _______ a day keeps the doctor away.", answer: "apple", options: ["apple", "bread", "coffee", "rice"] },
        { sentence: "We eat _______ with dinner.", answer: "rice", options: ["rice", "bread", "apple", "tea"] },
        { sentence: "I like grilled _______.", answer: "chicken", options: ["chicken", "bread", "rice", "milk"] },
        { sentence: "I'm very _______.", answer: "hungry", options: ["hungry", "delicious", "tall", "kind"] },
      ],
    };

    const app = document.getElementById("app");
    TelegramApp.init();
    const params = TelegramApp.getParams();
    const lessonId = params.lesson || 1;
    const questions = DATA[lessonId] || DATA[1];

    let index = 0, score = 0, wrongIds = [];

    function render() {
      if (index >= questions.length) { showResult(); return; }
      const q = questions[index];
      UI.setProgress(index, questions.length);
      const shuffled = [...q.options].sort(() => Math.random() - 0.5);

      app.innerHTML = UI.renderShell(
        `Вставь слово: Урок ${lessonId}`,
        `${index + 1} из ${questions.length}`,
        `<div class="card fade-in">
          <div style="font-size:1.125rem;line-height:1.6;margin-bottom:16px">${q.sentence.replace("_______", '<span style="font-weight:700;color:var(--primary)">_______</span>')}</div>
          <div id="feedback" style="text-align:center;margin-bottom:8px"></div>
        </div>`
      );

      document.getElementById("actions").innerHTML = shuffled.map(opt =>
        `<button class="quiz-option" onclick="select('${opt}')">${opt}</button>`
      ).join("");
    }

    window.select = function(val) {
      const q = questions[index];
      const correct = val === q.answer;
      const fb = document.getElementById("feedback");

      if (correct) {
        score++;
        fb.innerHTML = '<span class="tag tag-success">✓ Правильно!</span>';
      } else {
        wrongIds.push(q.answer.toLowerCase());
        fb.innerHTML = `<span class="tag tag-danger">✗ ${q.answer}</span>`;
      }

      document.querySelectorAll(".quiz-option").forEach(b => b.disabled = true);
      document.querySelectorAll(".quiz-option").forEach(b => {
        if (b.textContent === q.answer) b.classList.add("correct");
        else if (b.textContent === val && !correct) b.classList.add("wrong");
      });

      setTimeout(() => { index++; render(); }, 800);
    };

    function showResult() {
      const resultUrl = UI.buildResultUrl(params, score, questions.length, wrongIds);
      app.innerHTML = UI.renderShell(
        `Вставь слово: Урок ${lessonId}`, "Результат",
        UI.renderResult(score, questions.length, [])
      );
      document.getElementById("actions").innerHTML =
        `<a class="btn btn-primary" href="${resultUrl}">✅ Продолжить</a>`;
    }

    render();
  </script>
</body>
</html>
