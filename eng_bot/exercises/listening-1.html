<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>На слух</title>
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    .listen-btn {
      width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--primary);
      background: var(--primary-light); display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px; cursor: pointer; transition: all 0.15s; font-size: 2rem;
    }
    .listen-btn:active { transform: scale(0.9); background: var(--primary); color: white; }
    .listen-btn.playing { animation: pulse 0.6s infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="../shared/app.js"></script>
  <script src="../shared/components.js"></script>
  <script>
    const DATA = {
      1: [
        { word: "Hello", translation: "Привет" },
        { word: "Goodbye", translation: "До свидания" },
        { word: "Please", translation: "Пожалуйста" },
        { word: "Thank you", translation: "Спасибо" },
        { word: "Yes", translation: "Да" },
        { word: "No", translation: "Нет" },
        { word: "Good morning", translation: "Доброе утро" },
        { word: "How are you", translation: "Как дела" },
      ],
      2: [
        { word: "Mother", translation: "Мама" },
        { word: "Father", translation: "Папа" },
        { word: "Sister", translation: "Сестра" },
        { word: "Brother", translation: "Брат" },
        { word: "Family", translation: "Семья" },
        { word: "Friend", translation: "Друг" },
        { word: "Tall", translation: "Высокий" },
        { word: "Kind", translation: "Добрый" },
      ],
      3: [
        { word: "Water", translation: "Вода" },
        { word: "Bread", translation: "Хлеб" },
        { word: "Coffee", translation: "Кофе" },
        { word: "Tea", translation: "Чай" },
        { word: "Apple", translation: "Яблоко" },
        { word: "Rice", translation: "Рис" },
        { word: "Chicken", translation: "Курица" },
        { word: "Hungry", translation: "Голодный" },
      ],
    };

    const app = document.getElementById("app");
    TelegramApp.init();
    const params = TelegramApp.getParams();
    const lessonId = params.lesson || 1;
    const words = DATA[lessonId] || DATA[1];

    let index = 0, score = 0, wrongIds = [];

    function speak(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = 0.85;
      u.pitch = 1;
      window.speechSynthesis.speak(u);
    }

    function render() {
      if (index >= words.length) { showResult(); return; }
      const w = words[index];
      UI.setProgress(index, words.length);

      app.innerHTML = UI.renderShell(
        `На слух: Урок ${lessonId}`,
        `${index + 1} из ${words.length}`,
        `<div class="card fade-in" style="text-align:center">
          <div class="listen-btn" id="listen-btn" onclick="listen()">🔊</div>
          <div style="color:var(--text-secondary);margin-bottom:16px">${w.translation}</div>
          <input type="text" class="input-field" id="input" placeholder="Что услышал?" autocomplete="off" autocapitalize="off" spellcheck="false"/>
          <div id="feedback" style="margin-top:12px;text-align:center"></div>
        </div>`
      );

      document.getElementById("actions").innerHTML =
        `<button class="btn btn-primary" id="check-btn" onclick="check()">Проверить</button>`;

      setTimeout(() => speak(w.word), 300);
      const input = document.getElementById("input");
      input.focus();
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") check(); });
    }

    window.listen = function() {
      const w = words[index];
      const btn = document.getElementById("listen-btn");
      btn.classList.add("playing");
      speak(w.word);
      setTimeout(() => btn.classList.remove("playing"), 600);
    };

    window.check = function() {
      const input = document.getElementById("input");
      const val = input.value.trim();
      if (!val) return;
      const w = words[index];
      const correct = val.toLowerCase() === w.word.toLowerCase();
      const fb = document.getElementById("feedback");

      if (correct) {
        score++;
        fb.innerHTML = '<span class="tag tag-success">✓ Правильно!</span>';
        input.style.borderColor = "var(--success)";
      } else {
        wrongIds.push(w.word.toLowerCase().replace(/[^a-z ]/g, ""));
        fb.innerHTML = `<span class="tag tag-danger">✗ ${w.word}</span>`;
        input.style.borderColor = "var(--danger)";
      }
      input.disabled = true;
      document.getElementById("check-btn").disabled = true;
      setTimeout(() => { index++; render(); }, 1200);
    };

    function showResult() {
      const resultUrl = UI.buildResultUrl(params, score, words.length, wrongIds);
      app.innerHTML = UI.renderShell(
        `На слух: Урок ${lessonId}`, "Результат",
        UI.renderResult(score, words.length, [])
      );
      document.getElementById("actions").innerHTML =
        `<a class="btn btn-primary" href="${resultUrl}">✅ Продолжить</a>`;
    }

    render();
  </script>
</body>
</html>
