<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Карточки слов</title>
  <link rel="stylesheet" href="../shared/style.css">
</head>
<body>
  <div id="app"></div>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="../shared/app.js"></script>
  <script src="../shared/components.js"></script>
  <script>
    const WORDS = {
      1: [
        { id: "hello", word: "Hello", translation: "Привет", example: "Hello, how are you?" },
        { id: "goodbye", word: "Goodbye", translation: "До свидания", example: "Goodbye, see you tomorrow!" },
        { id: "please", word: "Please", translation: "Пожалуйста", example: "Please sit down." },
        { id: "thank_you", word: "Thank you", translation: "Спасибо", example: "Thank you very much!" },
        { id: "yes", word: "Yes", translation: "Да", example: "Yes, I agree." },
        { id: "no", word: "No", translation: "Нет", example: "No, thank you." },
        { id: "good_morning", word: "Good morning", translation: "Доброе утро", example: "Good morning, everyone!" },
        { id: "how_are_you", word: "How are you?", translation: "Как дела?", example: "Hi! How are you?" },
        { id: "nice_to_meet_you", word: "Nice to meet you", translation: "Приятно познакомиться", example: "Nice to meet you, I'm John." },
      ],
      2: [
        { id: "mother", word: "Mother", translation: "Мама", example: "My mother is a teacher." },
        { id: "father", word: "Father", translation: "Папа", example: "My father works in an office." },
        { id: "sister", word: "Sister", translation: "Сестра", example: "I have one sister." },
        { id: "brother", word: "Brother", translation: "Брат", example: "My brother is older than me." },
        { id: "family", word: "Family", translation: "Семья", example: "I love my family." },
        { id: "friend", word: "Friend", translation: "Друг", example: "She is my best friend." },
      ],
      3: [
        { id: "water", word: "Water", translation: "Вода", example: "Can I have some water?" },
        { id: "bread", word: "Bread", translation: "Хлеб", example: "I eat bread for breakfast." },
        { id: "coffee", word: "Coffee", translation: "Кофе", example: "I drink coffee every morning." },
        { id: "tea", word: "Tea", translation: "Чай", example: "Would you like some tea?" },
        { id: "apple", word: "Apple", translation: "Яблоко", example: "An apple a day keeps the doctor away." },
        { id: "hungry", word: "Hungry", translation: "Голодный", example: "I'm very hungry." },
      ],
    };

    const app = document.getElementById("app");
    const ctx = TelegramApp.init();
    const params = TelegramApp.getParams();
    const lessonId = params.lesson || 1;
    const words = WORDS[lessonId] || WORDS[1];

    let index = 0;
    let correctIds = [];
    let wrongIds = [];
    let revealed = false;

    function render() {
      if (index >= words.length) {
        showResult();
        return;
      }

      const w = words[index];
      UI.setProgress(index, words.length);

      app.innerHTML = UI.renderShell(
        `Карточки: Урок ${lessonId}`,
        `${index + 1} из ${words.length}`,
        `
          <div class="word-card fade-in" id="card" onclick="reveal()">
            <div class="word-main" id="card-front">${w.word}</div>
            <div class="word-secondary hidden" id="card-back">${w.translation}</div>
            <div class="word-example hidden" id="card-example">"${w.example}"</div>
          </div>
        `
      );

      document.getElementById("actions").innerHTML = `
        <div id="btn-correct" class="hidden" style="margin-bottom:8px">
          <button class="btn btn-success" onclick="markCorrect()">✓ Знаю</button>
        </div>
        <div id="btn-wrong" class="hidden">
          <button class="btn btn-outline" onclick="markWrong()">✗ Не помню</button>
        </div>
      `;
    }

    function reveal() {
      if (revealed) return;
      revealed = true;
      document.getElementById("card-back").classList.remove("hidden");
      document.getElementById("card-example").classList.remove("hidden");
      document.getElementById("btn-correct").classList.remove("hidden");
      document.getElementById("btn-wrong").classList.remove("hidden");
    }

    window.markCorrect = function () {
      correctIds.push(words[index].id);
      index++;
      revealed = false;
      render();
    };

    window.markWrong = function () {
      wrongIds.push(words[index].id);
      index++;
      revealed = false;
      render();
    };

    function showResult() {
      const resultUrl = UI.buildResultUrl(params, correctIds.length, words.length, wrongIds);

      const wrongWords = wrongIds.map(id => words.find(w => w.id === id)).filter(Boolean);

      app.innerHTML = UI.renderShell(
        `Карточки: Урок ${lessonId}`,
        "Результат",
        UI.renderResult(correctIds.length, words.length, wrongWords)
      );

      document.getElementById("actions").innerHTML = `
        <a class="btn btn-primary" href="${resultUrl}">✅ Продолжить</a>
      `;
    }

    render();
  </script>
</body>
</html>
